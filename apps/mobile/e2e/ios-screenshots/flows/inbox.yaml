appId: com.rakazo.app
name: Inbox
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      RAKAZO_ACTIVE_EMAIL: ${RAKAZO_SCREENSHOT_EMAIL}
- extendedWaitUntil:
    visible: ".*Researcher.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-inbox
# Pins use the same native menu as rows, including groups.
- longPressOn: ".*Researcher.*"
- tapOn: "Pin"
- longPressOn: ".*Writer.*"
- tapOn: "Pin"
- longPressOn: ".*Support.*"
- tapOn: "Pin"
- longPressOn: ".*Launch team.*"
- tapOn: "Pin"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-pinned-grid
- longPressOn: "Researcher"
- assertVisible: "Unpin"
- takeScreenshot: 01-pinned-menu
- tapOn: "Unpin"
- assertVisible: ".*Researcher.*"
- tapOn: "Activity"
- extendedWaitUntil:
    visible: ".*Recent.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-activity
- tapOn: "Activity"
- openLink: "rakazo:///artifacts"
- extendedWaitUntil:
    visible: ".*launch-notes.txt.*|.*No artifacts yet.*|.*Artifacts.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-artifacts
